<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0e11">
<title>Garçom | Sabor Original</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #0d0e11; --surface: #171a20; --surface-2: #20242c; --line: #2d323c;
  --fg: #f1f2f4; --muted: #98a0ad; --gold: #eba63f; --gold-ink: #1b1305;
  --ok: #47c58b; --ok-ink: #05150d; --late: #f0605d; --focus: #ffd37a;
  --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eef0f3; --surface: #ffffff; --surface-2: #e9ecf1; --line: #cfd4dc;
    --fg: #15181d; --muted: #586070; --gold: #a96500; --gold-ink: #ffffff;
    --ok: #12804f; --ok-ink: #ffffff; --late: #c62b28; --focus: #8a5200;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.4; padding: 0 16px 130px; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 720px; margin-inline: auto; }

/* topo */
.top { display: flex; align-items: center; gap: 14px; padding: calc(14px + env(safe-area-inset-top, 0px)) 0 12px; }
.brand { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-display); line-height: 1; margin-right: auto; }
.brand-s { font-weight: 700; font-size: 1.7rem; letter-spacing: 0.06em; }
.brand-o { font-weight: 600; font-size: 1.25rem; color: var(--gold); font-style: italic; }
.conn { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); }
.conn i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
.conn.on i { background: var(--ok); }
.conn.off i { background: var(--late); }
.linkbtn { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: 0.85rem; padding: 6px; }

/* abas */
.tabs { position: sticky; top: calc(6px + env(safe-area-inset-top, 0px)); z-index: 10; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 18px; }
.tab { border: 0; background: transparent; color: var(--muted); border-radius: 12px; padding: 12px 8px; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; letter-spacing: 0.03em; }
.tab[aria-selected="true"] { background: var(--gold); color: var(--gold-ink); }
.badge { min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; display: inline-grid; place-items: center; background: var(--surface-2); color: var(--fg); font-family: var(--font-body); font-size: 0.85rem; font-weight: 700; }
.tab[aria-selected="true"] .badge { background: var(--gold-ink); color: var(--gold); }
.tab .badge.ready { background: var(--ok); color: var(--ok-ink); }

/* blocos */
.block { margin-bottom: 22px; }
.block-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; letter-spacing: 0.02em; margin: 0; line-height: 1.1; }
.block-h .hint { margin-left: auto; }
.hint { color: var(--muted); font-size: 0.9rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.stack { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
.in { width: 100%; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 1.05rem; }
.in::placeholder { color: var(--muted); }
textarea.in { resize: vertical; min-height: 64px; }
.row2 { display: grid; grid-template-columns: 120px 1fr; gap: 12px; }
.in.mesa { font-family: var(--font-display); font-weight: 700; font-size: 2.2rem; text-align: center; padding: 4px 8px; line-height: 1.3; }

/* cardápio */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 10px; }
.tile { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; min-height: 76px; padding: 12px; padding-right: 36px; text-align: left; font-weight: 600; font-size: 1.02rem; line-height: 1.2; display: flex; align-items: flex-end; transition: transform .08s; }
.tile:active { transform: scale(0.96); }
.tile.on { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); background: var(--surface-2); }
.tile .cnt { position: absolute; top: 8px; right: 8px; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 13px; background: var(--gold); color: var(--gold-ink); display: grid; place-items: center; font-weight: 700; font-size: 0.9rem; }
.addrow { display: flex; gap: 8px; margin-top: 12px; }

/* itens do pedido */
.lines { display: grid; gap: 10px; }
.line { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.line .nm { font-weight: 600; font-size: 1.1rem; overflow-wrap: anywhere; }
.line .obs-btn { grid-column: 1 / -1; justify-self: start; border: 0; background: none; color: var(--gold); font-weight: 600; font-size: 0.9rem; padding: 2px 0; }
.line .in { grid-column: 1 / -1; padding: 10px; font-size: 1rem; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); overflow: hidden; }
.qty button { border: 0; background: transparent; width: 46px; height: 46px; font-size: 1.5rem; }
.qty span { min-width: 30px; text-align: center; font-weight: 700; font-size: 1.1rem; }
.qty .rm { color: var(--late); font-size: 1.1rem; }
.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 22px 18px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; margin-bottom: 4px; }

details.more { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
details.more summary { padding: 14px 16px; font-weight: 600; cursor: pointer; color: var(--muted); }
details.more[open] summary { color: var(--fg); }
details.more .stack { padding: 0 16px 16px; }

/* botões */
.btn { border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 12px; padding: 12px 18px; font-weight: 600; font-size: 1rem; }
.btn.gold { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.btn.ok { background: var(--ok); color: var(--ok-ink); border-color: var(--ok); }
.btn.big { width: 100%; padding: 16px 18px; font-size: 1.15rem; font-family: var(--font-display); letter-spacing: 0.04em; text-transform: uppercase; font-weight: 700; }
.btn.small { padding: 10px 14px; font-size: 0.95rem; }
.btn[disabled] { opacity: 0.55; cursor: default; }
.err { color: var(--late); font-weight: 600; min-height: 1.2em; margin: 0; }

/* barra de envio */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.bar .wrap { display: flex; align-items: center; gap: 14px; }
.sum { display: grid; line-height: 1.15; min-width: 0; }
.sum b { font-family: var(--font-display); font-size: 1.45rem; font-weight: 700; }
.sum span { color: var(--muted); font-size: 0.85rem; }
.bar .btn.big { width: auto; flex: 1; }

/* pedidos em andamento */
.orders { display: grid; gap: 12px; }
.order { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.order.preparando { border-left-color: var(--gold); }
.order.pronto { border-color: var(--ok); border-left-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
.order-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.order-head .mesa { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1; }
.order-head .cli { color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.pill { margin-left: auto; font-size: 0.8rem; font-weight: 700; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); }
.pill.preparando { color: var(--gold); border-color: var(--gold); }
.pill.pronto { background: var(--ok); color: var(--ok-ink); border-color: var(--ok); }
.olines { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.olines em { font-style: normal; color: var(--muted); margin-left: 6px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.since { color: var(--muted); font-size: 0.85rem; margin-right: auto; }
.order.pronto .actions .btn { flex: 1 1 100%; padding: 14px; font-size: 1.05rem; }

.login { max-width: 420px; margin: 8vh auto 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600; max-width: calc(100vw - 32px); z-index: 20; text-align: center; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="brand-s">SABOR</span><span class="brand-o">Original</span></div>
    <span id="conn" class="conn" hidden><i></i><span id="conn-txt"></span></span>
    <button id="logout" class="linkbtn" type="button" hidden>Sair</button>
  </header>

  <div id="config-err" class="card" hidden>
    <h2>Falta configurar</h2>
    <p class="hint">Abra este arquivo (index.html) e cole a URL e a chave do seu projeto Supabase no começo do script.</p>
  </div>

  <section id="login" class="login card stack" hidden>
    <h2>Entrar</h2>
    <form id="login-form" class="stack">
      <div class="field"><label for="email">E-mail</label><input id="email" class="in" type="email" autocomplete="username" required></div>
      <div class="field"><label for="senha">Senha</label><input id="senha" class="in" type="password" autocomplete="current-password" required></div>
      <p id="login-err" class="err" role="alert"></p>
      <button class="btn gold big" id="login-btn" type="submit">Entrar</button>
    </form>
  </section>

  <main id="app" hidden>
    <nav class="tabs" role="tablist">
      <button class="tab" id="tab-novo" role="tab" type="button" aria-selected="true">Novo pedido</button>
      <button class="tab" id="tab-and" role="tab" type="button" aria-selected="false">Em andamento <span id="badge" class="badge num" hidden>0</span></button>
    </nav>

    <form id="form" autocomplete="off">
      <div id="v-novo">
        <div class="block">
          <div class="row2">
            <div class="field"><label for="mesa">Mesa</label><input id="mesa" class="in mesa" type="text" inputmode="numeric" maxlength="12" placeholder="12" required></div>
            <div class="field"><label for="cliente">Cliente (opcional)</label><input id="cliente" class="in" type="text" maxlength="40" placeholder="Nome do cliente" style="margin-top:auto;padding:16px 12px"></div>
          </div>
        </div>

        <div class="block">
          <div class="block-h"><h2>Cardápio</h2><span class="hint">Toque para adicionar</span></div>
          <div id="chips" class="tiles"></div>
          <div class="addrow">
            <input id="custom" class="in" type="text" maxlength="60" placeholder="Item fora do cardápio" aria-label="Item fora do cardápio">
            <button type="button" id="add-item" class="btn">Adicionar</button>
          </div>
        </div>

        <div class="block">
          <div class="block-h"><h2>Pedido</h2></div>
          <div id="items" class="lines"></div>
        </div>

        <details class="more">
          <summary>Mais detalhes (observação e garçom)</summary>
          <div class="stack">
            <div class="field"><label for="obs">Observação do pedido</label><textarea id="obs" class="in" maxlength="200" placeholder="Ex.: trazer tudo junto, cliente com pressa"></textarea></div>
            <div class="field"><label for="garcom">Garçom</label><input id="garcom" class="in" type="text" maxlength="30" placeholder="Seu nome"></div>
          </div>
        </details>
      </div>

      <div id="bar" class="bar">
        <div class="wrap">
          <div class="sum"><b id="sum-a">Pedido vazio</b><span id="sum-b">Informe a mesa</span></div>
          <button type="submit" id="send" class="btn gold big">Enviar para a cozinha</button>
        </div>
      </div>
    </form>

    <section id="v-and" hidden>
      <div id="orders" class="orders"></div>
    </section>
  </main>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.min.js"></script>
<script>
/* ===== CONFIGURAÇÃO: cole aqui os dados do seu projeto Supabase ===== */
var SUPABASE_URL = 'https://persjsywifbuhqilktut.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_resb0eT3FvA0q2xxpwR6uw_yaod0nUS';
/* ==================================================================== */
</script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  function h(tag, attrs) {
    var e = document.createElement(tag), a = attrs || {};
    Object.keys(a).forEach(function (k) {
      var v = a[k];
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
    });
    (function add(list) {
      for (var i = 0; i < list.length; i++) {
        var c = list[i];
        if (c == null || c === false) continue;
        if (Array.isArray(c)) add(c);
        else e.append(c.nodeType ? c : document.createTextNode(String(c)));
      }
    })(Array.prototype.slice.call(arguments, 2));
    return e;
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  if (!window.supabase || SUPABASE_URL.indexOf('COLE_AQUI') === 0 || SUPABASE_ANON_KEY.indexOf('COLE_AQUI') === 0) {
    $('#config-err').hidden = false; return;
  }
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var OPEN = ['novo', 'preparando', 'pronto'];
  var orders = new Map(), menu = [], channel = null, pollTimer = null, loaded = false;
  var draft = [];
  var audioCtx = null, tab = 'novo';

  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 3500);
  }
  function setConn(state, txt) { var c = $('#conn'); c.hidden = false; c.className = 'conn ' + state; $('#conn-txt').textContent = txt; }
  function ago(ms) { var m = Math.max(0, Math.floor((Date.now() - ms) / 60000)); return m < 1 ? 'agora' : m + ' min'; }
  function statusLabel(s) { return s === 'novo' ? 'Na fila' : s === 'preparando' ? 'Preparando' : 'Pronto: retirar'; }
  function prep(o) { o.t = Date.parse(o.criado_em); return o; }

  /* som de aviso (o navegador só libera depois de um toque) */
  function ensureAudio() {
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {}
  }
  document.addEventListener('pointerdown', ensureAudio, { once: true });
  function chime() {
    ensureAudio();
    if (audioCtx) {
      var t0 = audioCtx.currentTime;
      [[784, 0, 0.25], [1047, 0.2, 0.4]].forEach(function (n) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = n[0];
        g.gain.setValueAtTime(0.0001, t0 + n[1]);
        g.gain.exponentialRampToValueAtTime(0.2, t0 + n[1] + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + n[1] + n[2]);
        o.connect(g); g.connect(audioCtx.destination); o.start(t0 + n[1]); o.stop(t0 + n[1] + n[2] + 0.02);
      });
    }
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
  }

  /* ---------- abas ---------- */
  function setTab(name) {
    tab = name;
    $('#tab-novo').setAttribute('aria-selected', name === 'novo');
    $('#tab-and').setAttribute('aria-selected', name === 'and');
    $('#v-novo').hidden = name !== 'novo';
    $('#bar').hidden = name !== 'novo';
    $('#v-and').hidden = name !== 'and';
    window.scrollTo(0, 0);
  }
  $('#tab-novo').addEventListener('click', function () { setTab('novo'); });
  $('#tab-and').addEventListener('click', function () { setTab('and'); });

  /* ---------- login ---------- */
  function showLogin() {
    $('#login').hidden = false; $('#app').hidden = true; $('#logout').hidden = true; $('#conn').hidden = true;
  }
  function enter() {
    $('#login').hidden = true; $('#app').hidden = false; $('#logout').hidden = false;
    loaded = false; setTab('novo');
    loadMenu();
    refetch(false).then(function () { loaded = true; });
    subscribe();
    clearInterval(pollTimer);
    pollTimer = setInterval(function () { refetch(loaded); renderTimes(); }, 20000);
  }
  function leave() {
    clearInterval(pollTimer);
    if (channel) { sb.removeChannel(channel); channel = null; }
    orders = new Map(); showLogin();
  }
  $('#login-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = $('#login-btn'); btn.disabled = true; $('#login-err').textContent = '';
    sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#senha').value }).then(function (r) {
      btn.disabled = false;
      if (r.error) { $('#login-err').textContent = 'E-mail ou senha incorretos.'; return; }
      $('#senha').value = ''; enter();
    }, function () { btn.disabled = false; $('#login-err').textContent = 'Sem internet. Tente de novo.'; });
  });
  $('#logout').addEventListener('click', function () { sb.auth.signOut().then(leave); });
  sb.auth.getSession().then(function (r) { if (r.data && r.data.session) enter(); else showLogin(); });
  sb.auth.onAuthStateChange(function (ev) { if (ev === 'SIGNED_OUT') leave(); });

  /* ---------- dados ---------- */
  function loadMenu() {
    sb.from('cardapio').select('nome').eq('ativo', true).order('ordem').then(function (r) {
      menu = (r.data || []).map(function (x) { return x.nome; }); renderChips();
    });
  }
  function announce(ann) {
    if (ann.readyNow.length) { chime(); toast('Pronto: mesa ' + ann.readyNow.map(function (o) { return o.mesa; }).join(', ')); }
  }
  function sync(rows, doAnnounce) {
    var ann = { readyNow: [] }, next = new Map();
    rows.forEach(function (o) {
      var prev = orders.get(o.id); next.set(o.id, o);
      if (doAnnounce && prev && prev.status !== 'pronto' && o.status === 'pronto') ann.readyNow.push(o);
    });
    orders = next; return ann;
  }
  function ingestOne(o) {
    var prev = orders.get(o.id), ann = { readyNow: [] };
    if (OPEN.indexOf(o.status) >= 0) orders.set(o.id, o); else orders.delete(o.id);
    if (prev && prev.status !== 'pronto' && o.status === 'pronto') ann.readyNow.push(o);
    return ann;
  }
  function refetch(doAnnounce) {
    var since = new Date(Date.now() - 24 * 3600 * 1000).toISOString();
    return sb.from('pedidos').select('*').in('status', OPEN).gte('criado_em', since).order('criado_em', { ascending: true }).then(function (r) {
      if (r.error) { setConn('off', 'Sem conexão'); return; }
      var ann = sync(r.data.map(prep), doAnnounce); render(); announce(ann);
    }, function () { setConn('off', 'Sem conexão'); });
  }
  function subscribe() {
    if (channel) sb.removeChannel(channel);
    channel = sb.channel('pedidos-garcom').on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, function (p) {
      if (!p.new || !p.new.id) return;
      var ann = ingestOne(prep(p.new)); render(); announce(ann);
    }).subscribe(function (st) {
      if (st === 'SUBSCRIBED') { setConn('on', 'Ao vivo'); if (loaded) refetch(true); }
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') setConn('off', 'Reconectando');
    });
  }
  function setStatus(id, status) {
    var patch = { status: status };
    if (status !== 'cancelado') patch[status + '_em'] = new Date().toISOString();
    sb.from('pedidos').update(patch).eq('id', id).then(function (r) {
      if (r.error) toast('Não foi possível atualizar. Tente de novo.'); else refetch(false);
    });
  }

  /* ---------- novo pedido ---------- */
  function countOf(name) {
    return draft.reduce(function (s, d) { return d.n === name ? s + d.q : s; }, 0);
  }
  function renderChips() {
    var box = $('#chips'); box.textContent = '';
    if (!menu.length) { box.append(h('span', { class: 'hint', text: 'Cardápio vazio. Digite os itens no campo abaixo.' })); return; }
    menu.forEach(function (name) {
      var c = countOf(name);
      box.append(h('button', { type: 'button', class: 'tile' + (c ? ' on' : ''), onclick: function () { addItem(name); } }, name, c ? h('span', { class: 'cnt num', text: String(c) }) : null));
    });
  }
  function addItem(name) {
    var same = draft.filter(function (d) { return d.n === name; })[0];
    if (same) same.q = Math.min(99, same.q + 1); else draft.push({ q: 1, n: name, o: '', open: false });
    renderDraft();
    try { if (navigator.vibrate) navigator.vibrate(15); } catch (e) {}
  }
  function updateBar() {
    var total = draft.reduce(function (s, d) { return s + d.q; }, 0), mesa = $('#mesa').value.trim();
    $('#sum-a').textContent = total ? total + (total === 1 ? ' item' : ' itens') : 'Pedido vazio';
    $('#sum-b').textContent = mesa ? 'Mesa ' + mesa : 'Informe a mesa';
  }
  function renderDraft() {
    var box = $('#items'); box.textContent = '';
    if (!draft.length) {
      box.append(h('div', { class: 'empty' }, h('strong', { text: 'Nenhum item ainda' }), 'Toque nos itens do cardápio para montar o pedido.'));
    }
    draft.forEach(function (it, idx) {
      var qv = h('span', { class: 'num', text: String(it.q) });
      var minus = h('button', { type: 'button', 'aria-label': 'Diminuir', text: '−', onclick: function () { it.q -= 1; if (it.q < 1) draft.splice(idx, 1); renderDraft(); } });
      var plus = h('button', { type: 'button', 'aria-label': 'Aumentar', text: '+', onclick: function () { it.q = Math.min(99, it.q + 1); renderDraft(); } });
      var rm = h('button', { type: 'button', class: 'rm', 'aria-label': 'Remover ' + it.n, text: '✕', onclick: function () { draft.splice(idx, 1); renderDraft(); } });
      var row = h('div', { class: 'line' }, h('span', { class: 'nm', text: it.n }), h('div', { class: 'qty' }, minus, qv, plus, rm));
      if (it.open || it.o) {
        row.append(h('input', { class: 'in', type: 'text', placeholder: 'Ex.: sem cebola, bem passado', maxlength: '80', value: it.o, 'aria-label': 'Observação de ' + it.n, oninput: function (e) { it.o = e.target.value; } }));
      } else {
        row.append(h('button', { type: 'button', class: 'obs-btn', text: '+ Observação', onclick: function () { it.open = true; renderDraft(); var i = document.querySelectorAll('#items .line')[idx].querySelector('input'); if (i) i.focus(); } }));
      }
      box.append(row);
    });
    renderChips(); updateBar();
  }
  function addCustom() {
    var inp = $('#custom'), v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    addItem(v); inp.value = ''; inp.focus();
  }
  $('#add-item').addEventListener('click', addCustom);
  $('#custom').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addCustom(); } });
  $('#mesa').addEventListener('input', updateBar);
  /* Enter nos campos de texto não envia o pedido sem querer */
  $('#form').addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.preventDefault(); });
  $('#garcom').value = lsGet('sabor-garcom') || '';

  $('#form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var mesa = $('#mesa').value.trim();
    var itens = draft.filter(function (d) { return d.n.trim(); }).map(function (d) { return { q: d.q, n: d.n.trim(), o: d.o.trim() }; });
    if (!mesa) { toast('Informe o número da mesa.'); $('#mesa').focus(); window.scrollTo(0, 0); return; }
    if (!itens.length) { toast('Adicione ao menos um item.'); return; }
    var garcom = $('#garcom').value.trim(); lsSet('sabor-garcom', garcom);
    var btn = $('#send'); btn.disabled = true;
    sb.from('pedidos').insert({ mesa: mesa, cliente: $('#cliente').value.trim() || null, garcom: garcom || null, itens: itens, obs: $('#obs').value.trim() || null }).then(function (r) {
      btn.disabled = false;
      if (r.error) { toast('Não foi possível enviar. Confira a internet e tente de novo.'); return; }
      toast('Pedido enviado: mesa ' + mesa);
      $('#mesa').value = ''; $('#cliente').value = ''; $('#obs').value = '';
      draft = []; renderDraft(); refetch(false); window.scrollTo(0, 0);
      try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
    }, function () { btn.disabled = false; toast('Sem internet. O pedido NÃO foi enviado.'); });
  });

  /* ---------- em andamento ---------- */
  function render() {
    var box = $('#orders'); box.textContent = '';
    var list = Array.from(orders.values()).sort(function (a, b) {
      var pa = a.status === 'pronto' ? 0 : 1, pb = b.status === 'pronto' ? 0 : 1;
      return pa - pb || a.t - b.t;
    });
    var ready = list.filter(function (o) { return o.status === 'pronto'; }).length, bd = $('#badge');
    bd.hidden = !list.length; bd.textContent = ready || list.length; bd.className = 'badge num' + (ready ? ' ready' : '');
    if (!list.length) {
      box.append(h('div', { class: 'empty' }, h('strong', { text: 'Nenhum pedido em andamento' }), 'Os pedidos enviados aparecem aqui até serem entregues.'));
      return;
    }
    list.forEach(function (o) {
      var actions = h('div', { class: 'actions' }, h('span', { class: 'since num', 'data-since': o.t, text: 'há ' + ago(o.t) }));
      if (o.status === 'pronto') actions.append(h('button', { class: 'btn ok small', type: 'button', text: 'Marcar como entregue', onclick: function () { setStatus(o.id, 'entregue'); } }));
      if (o.status === 'novo') actions.append(h('button', { class: 'btn small', type: 'button', text: 'Cancelar', onclick: function () { setStatus(o.id, 'cancelado'); } }));
      box.append(h('article', { class: 'order ' + o.status },
        h('div', { class: 'order-head' }, h('span', { class: 'mesa', text: 'Mesa ' + o.mesa }), o.cliente ? h('span', { class: 'cli', text: o.cliente }) : null, h('span', { class: 'pill ' + o.status, text: statusLabel(o.status) })),
        h('ul', { class: 'olines' }, (o.itens || []).map(function (it) { return h('li', {}, h('b', { class: 'num', text: it.q + '× ' }), it.n, it.o ? h('em', { text: '(' + it.o + ')' }) : null); })),
        o.obs ? h('div', { class: 'hint', text: 'Obs.: ' + o.obs }) : null,
        actions));
    });
  }
  function renderTimes() {
    document.querySelectorAll('[data-since]').forEach(function (el) { el.textContent = 'há ' + ago(Number(el.getAttribute('data-since'))); });
  }
  renderDraft(); render();
})();
</script>
</body>
</html>
